name: Publish verified Auto audit

on:
  push:
    branches: [fix/auto-search-space-audit-20260912]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'test: apply verified Auto audit patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply the exact locally tested patch to the review branch
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import subprocess
          import zlib
          from pathlib import Path

          manifest = Path('.auto-audit-patch.json')
          data = json.loads(manifest.read_text())
          expected = '853ccc3cdd7f161028c3b6efae3c944ae094672adb0f1c39b8a401d7a36335e7'
          base = 'eb48022afd9500787866731ec1fd8846dff1b912'
          parts = ['.auto-audit-patch.0', '.auto-audit-patch.1', '.auto-audit-patch.2']
          paths = [
              'neuralforecast/auto.py', 'neuralforecast/auto_external.py',
              'neuralforecast/common/_base_auto.py', 'neuralforecast/common/_base_model.py',
              'neuralforecast/models/fedformer.py', 'neuralforecast/models/gpt4mts.py',
              'tests/test_auto_search_spaces.py', 'docs/auto_search_space_audit.md',
          ]
          if data != {'base': base, 'sha256': expected}:
              raise RuntimeError('Unexpected audit manifest')
          encoded = ''.join(Path(part).read_text().strip() for part in parts)
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != expected:
              raise RuntimeError('Audit patch checksum mismatch')
          stats = subprocess.check_output(['git', 'apply', '--numstat'], input=patch).decode()
          changed = [line.split('\t', 2)[2] for line in stats.splitlines()]
          if sorted(changed) != sorted(paths):
              raise RuntimeError('Audit patch contains unexpected paths')
          subprocess.run(['git', 'diff', '--quiet', base, '--', *paths], check=True)
          subprocess.run(['git', 'apply', '--check', '--whitespace=error'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--whitespace=error'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'rm', '--', str(manifest), *parts], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: audit all Auto search spaces and remove inactive dimensions'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/fix/auto-search-space-audit-20260912'], check=True)
          PY
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'torch>=2.9.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest transformers
      - name: Validate the published sources
        run: |
          python -m pytest -o addopts='' -q tests/test_auto_search_spaces.py tests/test_auto_external.py tests/test_auto_external_registry.py
          python -m pytest -o addopts='' -q tests/test_common/test_base_auto.py -k 'optuna or validation_default or instantiation or missing_required'
