name: Auto search-space audit

on:
  push:
    branches: [fix/auto-search-space-audit-20260912]
  pull_request:
    paths:
      - 'neuralforecast/auto.py'
      - 'neuralforecast/auto_external.py'
      - 'neuralforecast/common/**'
      - 'neuralforecast/models/**'
      - 'tests/test_auto_search_spaces.py'
      - '.github/workflows/auto-search-space-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare offline audit dependencies
        run: python -m pip download --only-binary=:all: --no-deps --dest /tmp/audit-wheels 'ray[train,tune]>=2.2.0' 'pyarrow>=23.0.1' 'coreforecast>=0.0.6' 'utilsforecast>=0.2.3'
      - uses: actions/upload-artifact@v4
        with:
          name: auto-audit-wheels
          retention-days: 1
          path: /tmp/audit-wheels
